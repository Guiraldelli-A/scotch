<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar - scotch</title>
</head>
<body>
    <header>
        <h1><em>Sistema Admin - scotch</em></h1>
        <nav>
            <ul>
                <li><a href="admin.html">Painel Inicial</a></li>
                <li><a href="cadastro.html">Cadastrar Peça</a></li>
                <li><a href="listagem.html">Estoque (Listagem)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastrar Nova Peça</h2>
            <form action="#" method="post">
                <!-- Os mesmos campos que fizemos na etapa anterior -->
                <label for="nome">Nome da Peça:</label>
                <input type="text" id="nome" name="nome" required>
                <br><br>

                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria">
                    <option value="camiseta">Camiseta</option>
                    <option value="moletom">Moletom</option>
                </select>
                <br><br>

                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" name="preco" step="0.01" required>
                <br><br>

                <button type="submit">Salvar Cadastro</button>
            </form>
        </section>
    </main>
</body>
</html>
