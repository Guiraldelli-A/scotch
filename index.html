<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scotch - 1of1 Exclusivist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-main">
        <div class="logo-container">
            <h1 class="brand-logo">scotch</h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Shop</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="drop-section">
            <div class="section-title">
                <h2>Drop 01 — Disponível</h2>
                <p>Menos quantidade, máxima qualidade.</p>
            </div>
            
            <div class="product-grid">
                <!-- Produto 1 -->
                <article class="product-card">
                    <div class="product-image-placeholder">
                        <span>FOTO AQUI</span>
                    </div>
                    <div class="product-info">
                        <h3>Camiseta Oversized Faded</h3>
                        <p class="price">R$ 189,90</p>
                        <p class="status">Em Estoque</p>
                        <button class="btn-primary" type="button">Adicionar</button>
                    </div>
                </article>

                <article class="product-card">
                    <div class="product-image-placeholder">
                        <span>FOTO AQUI</span>
                    </div>
                    <div class="product-info">
                        <h3>Moletom Boxy Zip-up</h3>
                        <p class="price">R$ 349,90</p>
                        <p class="status">Em Estoque</p>
                        <button class="btn-primary" type="button">Adicionar</button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="footer-main">
        <p>&copy; 2026 scotch. Todos os direitos reservados.</p>
        <p><a href="admin.html" class="admin-link">Acesso Restrito (Admin)</a></p>
    </footer>
